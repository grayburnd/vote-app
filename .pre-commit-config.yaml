# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:

-   repo:  https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -  id: trailing-whitespace
    -  id: end-of-file-fixer
    -  id: check-yaml
    -  id: check-added-large-files
    -  id: check-case-conflict
    -  id: check-toml
    -  id: name-tests-test
       args: [--pytest-test-first] #ensure tests match test_.*\.py

-   repo: https://github.com/PyCQA/isort
    rev: 8.0.1
    hooks:
    -  id: isort

- repo: local
  hooks:
    - id: black-check
      name: black-check
      entry: uv run black --check .
      language: system
      types: [python]
      pass_filenames: false

- repo: local
  hooks:
    - id: ruff-check
      name: ruff-check
      entry: uv run ruff check .
      language: system
      types: [python]
      pass_filenames: false

-   repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
    -  id: gitleaks-docker ##Requires docker daemon

- repo: local
  hooks:
    - id: bandit
      name: bandit
      entry: uv run bandit -c pyproject.toml -r -lll .
      language: system
      types: [python]
      pass_filenames: false

- repo: local
  hooks:
    - id: mypy
      name: mypy
      entry: uv run mypy .
      language: system
      types: [python]
      pass_filenames: false
