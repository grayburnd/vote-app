name: CI Pipeline
on:
  workflow_dispatch:
  pull_request:
permissions:
  pull-requests: read
  contents: read
  id-token: write
jobs:
  call-lint:
    uses: grayburnd/vote-app/.github/workflows/ci-lint.yml@main
    with:
      uv-version: "0.12.1"
  call-test:
    needs: call-lint
    secrets: inherit
    uses: grayburnd/vote-app/.github/workflows/ci-test.yml@main
    with:
      uv-version: "0.12.1"
