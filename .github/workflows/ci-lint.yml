name: CI [Lint] (Callable ONLY)

on:
  workflow_call:
    inputs:
      uv-version:
        required: true
        type: string
permissions:
  contents: read
  pull-requests: read ##GitLeaks required.

jobs:
  ci-lint-and-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          # Install a specific version of uv.
          version: ${{ inputs.uv-version }}
          enable-cache: true

      - name: Install dependencies with uv
        run: uv sync --locked --all-groups ##Since UV is used as a virtual env for this

      - name: Format checks
        run: uv run black --check .

      - name: Linting checks
        run: uv run ruff check .

      - name: Security checks
        run: uv run bandit -c pyproject.toml -r -lll . ##Only return non-zero exit code for high and above findings, no config file equivalent

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Static type checks
        run: uv run mypy .

      - uses: hadolint/hadolint-action@v3.5.0 ##Lint dockerfile
        with:
          dockerfile: Dockerfile
