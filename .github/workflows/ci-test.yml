name: CI [Test] (Callable ONLY)

on:

  workflow_call:
    inputs:
      uv-version:
        required: true
        type: string

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "AWS_ACCOUNT_ID_REDACTED"
  APP: "voting-vote"
  RESULTS_ECR_REPO_NAME: "voting-results"
  WORKER_ECR_REPO_NAME: "voting-worker"

permissions:
  id-token: write
  contents: read

jobs:
  ci-tests-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Create interpolated env var
        run: echo "DOCKER_IMAGE_TAG=${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.APP }}:${{ github.event.pull_request.head.sha }}" >> $GITHUB_ENV

      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/gh_actions

      - name: Login to ECR
        run: aws ecr get-login-password | docker login --username AWS --password-stdin ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com

      - name: Build and tag docker image
        run: |
          docker build --pull --no-cache . -t ${{ env.DOCKER_IMAGE_TAG }}

      - name: Grab latest Image Tag from dependent containers
        run: |
          repo_list=( ${{ env.RESULTS_ECR_REPO_NAME }} ${{ env.WORKER_ECR_REPO_NAME }} )

          for repo in ${repo_list[*]}; do
              IMAGE_TAG=$(aws ecr describe-images --repository-name $repo --query 'imageDetails | sort_by(@, &imagePushedAt)[-1].imageTags[0]' --output text)
              repo_upper=${repo^^}
              repo_upper_normalized=${repo_upper//-/_}
              echo "${repo_upper_normalized}_LATEST_IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV
          done

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          # Install a specific version of uv.
          version: ${{ inputs.uv-version }}
          enable-cache: true

      - name: Install dependencies with uv
        run: uv sync --locked --all-groups ##Since UV is used as a virtual env for this
##DEBUG ONLY
