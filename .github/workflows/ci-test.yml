      #   run: cat compose.yml
##DEBUG ONLY

      - name: Run pytest
        env:
          REDIS_MASTER_ANNOUNCE_IP: ${{ vars.REDIS_MASTER_ANNOUNCE_IP }}
          REDIS_ANNOUNCE_IP: ${{ vars.REDIS_ANNOUNCE_IP }}
          REDIS_MASTER_HOST: ${{ vars.REDIS_MASTER_HOST }}
          REDIS_SENTINEL_HOST: ${{ vars.REDIS_SENTINEL_HOST }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          REDIS_SENTINEL_PORT: ${{ vars.REDIS_SENTINEL_PORT }}
          REDIS_MASTER_NAME: ${{ vars.REDIS_MASTER_NAME }}
          REDIS_USER_NAME: ${{ vars.REDIS_USER_NAME }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_USER: ${{ vars.POSTGRES_USER }}
          DB_HOST: ${{ vars.DB_HOST }}
          DB_PORT: ${{ vars.DB_PORT }}
          DB_USERNAME: ${{ vars.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB: ${{ vars.DB }}
          DB_SSL_MODE: ${{ vars.DB_SSL_MODE }}
          DOCKER_IMAGE_TAG: ${{ env.DOCKER_IMAGE_TAG }}
          VOTING_RESULTS_LATEST_IMAGE_TAG: ${{ env.VOTING_RESULTS_LATEST_IMAGE_TAG }}
          VOTING_WORKER_LATEST_IMAGE_TAG: ${{ env.VOTING_WORKER_LATEST_IMAGE_TAG }}
        run: |
          uv run pytest

      - name: Push docker image
        run: |
          docker push ${{ env.DOCKER_IMAGE_TAG }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.APP }}:${{ github.event.pull_request.head.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
