name: GitOps Image Tag updater
sources:
  imageTag:
    name: Get image tag from environment variable
    kind: shell
    spec:
      command: echo $TARGET_IMAGE_TAG
      environments:
        - name: TARGET_IMAGE_TAG
# # "conditions" describe what must be true before any target is updated.
# # Here: the matching Docker image must exist on DockerHub.
# conditions:
#   dockerimage:
#     name: Is the Jenkins weekly tag published on DockerHub
#     kind: dockerimage
#     spec:
#       image: jenkins/jenkins
scms:
  default:
    kind: github
    spec:
      owner: grayburnd
      repository: frontend-gitops
      token: "{{ requiredEnv \"UPDATECLI_GITHUB_TOKEN\" }}"
      branch: main
      commitmessage:
        # produces "deps(charts): <target name>"
        type: chore
        scope: image_tag
        # remove the "Made with ❤️ by updatecli" line from the commit body
        hidecredit: false
        # squash every commit of the working branch into one, using the body below
        squash: true
        body: |
          This commit was generated by Automation, using Updatecli.

# "targets" describe what to update with the source value.
# Here: the key "$.container.tag" of the file "data.yaml".
targets:
  dataFile:
    name: Bump the Jenkins Docker image tag
    kind: yaml
    scmid: default
    spec:
      file: apps/voting-vote/prod-values.yml
      key: $.image.tag
